name: Recuperar PDF de agentes IA de EcomBomb
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recuperar-pdf-ecombomb.yml']
permissions:
  contents: write
jobs:
  retrieve-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Descargar documento original
        run: |
          mkdir -p recursos
          curl --fail --location --silent --show-error --retry 2 --max-time 45 \
            -A 'Mozilla/5.0' \
            'https://auditor-ecombom-ia.vercel.app/LA_FABRICA_EcomBomb.pdf' \
            --output recursos/LA_FABRICA_EcomBomb.pdf
      - name: Validar documento PDF
        run: |
          test "$(head -c 5 recursos/LA_FABRICA_EcomBomb.pdf)" = '%PDF-'
          test "$(stat -c%s recursos/LA_FABRICA_EcomBomb.pdf)" -gt 500
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          p=Path("recursos/LA_FABRICA_EcomBomb.pdf")
          reader=PdfReader(str(p), strict=True)
          n=len(reader.pages)
          print(f"PDF VALIDADO: {n} paginas, {p.stat().st_size} bytes")
          assert n >= 1
          PY
      - name: Publicar copia recuperada en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/LA_FABRICA_EcomBomb.pdf
          git commit -m "Publicar PDF original de agentes IA recuperado de Vercel"
          git push
